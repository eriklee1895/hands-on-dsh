[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dsh-fastapi-101"
version = "0.1.0"
description = "A standalone FastAPI tutorial for embedding DeepSeek Harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "deepseek-harness-sdk>=0.1.1rc1,<0.2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_fastapi_101"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]
