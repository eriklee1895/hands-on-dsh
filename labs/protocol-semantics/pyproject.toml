[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "protocol-labs"
version = "0.1.0"
description = "Wire-level DeepSeek Harness protocol semantics labs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "tomli>=2,<3 ; python_full_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/protocol_labs"]

[tool.pytest.ini_options]
addopts = ["-q"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
